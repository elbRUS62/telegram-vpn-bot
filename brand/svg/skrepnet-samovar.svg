<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="SkrepNet">
  <title>SkrepNet — самовар</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5BC8F5"/>
      <stop offset=".52" stop-color="#2AABEE"/>
      <stop offset="1" stop-color="#1479B8"/>
    </linearGradient>
    <radialGradient id="glow" cx=".32" cy=".18" r=".9">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset=".6" stop-color="#ffffff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE2A8"/>
      <stop offset="1" stop-color="#DFA24A"/>
    </linearGradient>
  </defs>

  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="256" fill="url(#glow)"/>

  <!-- Wi-Fi вместо пара -->
  <g fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round">
    <path d="M226 206a30 30 0 0 1 60 0"/>
    <path d="M208 206a48 48 0 0 1 96 0"/>
    <path d="M190 206a66 66 0 0 1 132 0"/>
  </g>

  <!-- труба с воротником -->
  <rect x="244" y="230" width="24" height="50" rx="8" fill="#FFFFFF"/>
  <rect x="230" y="220" width="52" height="16" rx="8" fill="url(#gold)"/>

  <!-- кран -->
  <path d="M334 346h16a8 8 0 0 1 8 8v12" fill="none" stroke="url(#gold)" stroke-width="13" stroke-linecap="round"/>

  <!-- корпус -->
  <path d="M220 268c-24 14-38 46-42 74-4 24 4 44 18 46h120c14-2 22-22 18-46-4-28-18-60-42-74z" fill="#FFFFFF"/>

  <!-- поддон -->
  <rect x="178" y="384" width="156" height="16" rx="8" fill="#FFFFFF"/>
  <path d="M190 400h132v6a12 12 0 0 1-12 12H202a12 12 0 0 1-12-12z" fill="#FFFFFF"/>

  <!-- поясок и орнамент -->
  <path d="M181 336h150" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
  <g fill="url(#gold)">
    <circle cx="232" cy="366" r="5"/>
    <circle cx="256" cy="366" r="5"/>
    <circle cx="280" cy="366" r="5"/>
  </g>
</svg>
