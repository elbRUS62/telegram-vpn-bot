<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkrepNet - Подписка</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='116' fill='%232AABEE'/%3E%3Cg transform='translate(254 258) rotate(-45) scale(15.8) translate(-12 -12)' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48'/%3E%3C/g%3E%3C/svg%3E">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 32px;
            max-width: 480px;
            width: 100%;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #58a6ff;
        }
        .brand {
            display: block;
            width: 64px;
            height: 64px;
            margin: 0 auto 12px;
        }
        .subtitle {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            padding: 12px;
            background: #0d1117;
            border-radius: 8px;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #3fb950;
        }
        .dot.offline { background: #8b949e; }
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }
        .stat {
            background: #0d1117;
            padding: 12px;
            border-radius: 8px;
        }
        .stat-label {
            font-size: 12px;
            color: #8b949e;
            margin-bottom: 4px;
        }
        .stat-value {
            font-size: 16px;
            font-weight: 600;
        }
        .servers {
            margin-bottom: 24px;
        }
        .server {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: #0d1117;
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .flag { font-size: 24px; }
        .server-info { flex: 1; }
        .server-name { font-size: 14px; font-weight: 500; }
        .server-desc { font-size: 12px; color: #8b949e; }
        .donate {
            background: linear-gradient(135deg, #1f6feb 0%, #388bfd 100%);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        .donate p {
            font-size: 14px;
            margin-bottom: 12px;
            line-height: 1.5;
        }
        .donate a {
            display: inline-block;
            background: #fff;
            color: #0d1117;
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
        }
        .footer {
            text-align: center;
            margin-top: 16px;
            font-size: 12px;
            color: #8b949e;
        }
    </style>
</head>
<body>
    <div class="card">
        <svg class="brand" viewBox="0 0 512 512" width="64" height="64" aria-hidden="true">
            <defs>
                <linearGradient id="skrepnetBrandBg" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#5BC8F5"/>
                    <stop offset=".52" stop-color="#2AABEE"/>
                    <stop offset="1" stop-color="#1479B8"/>
                </linearGradient>
            </defs>
            <circle cx="256" cy="256" r="256" fill="url(#skrepnetBrandBg)"/>
            <g transform="translate(254 256) rotate(-45) scale(16.6) translate(-12 -12)"
               fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
            </g>
        </svg>
        <h1>SkrepNet</h1>
        <p class="subtitle">Бесплатный VPN для своих</p>

        <div class="status">
            <div class="dot {{ if not .isOnline }}offline{{ end }}"></div>
            <span>{{ if .isOnline }}Онлайн{{ else }}Оффлайн{{ end }}</span>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="stat-label">Использовано</div>
                <div class="stat-value">{{ .used }}</div>
            </div>
            <div class="stat">
                <div class="stat-label">Осталось</div>
                <div class="stat-value">{{ .remained }}</div>
            </div>
