<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} — SkrepNet</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="/static/favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <link rel="manifest" href="/static/site.webmanifest">
    <meta name="application-name" content="SkrepNet">
    <meta name="theme-color" content="#2AABEE">
    <style>
        .doc {
            max-width: 720px;
            margin: 0 auto;
            padding: 32px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            line-height: 1.7;
        }
        .doc h1 {
            color: #58a6ff;
            margin-bottom: 24px;
            font-size: 26px;
        }
        .doc h2 {
            color: #c9d1d9;
            margin: 28px 0 12px;
            font-size: 20px;
            border-bottom: 1px solid #30363d;
            padding-bottom: 6px;
        }
        .doc p {
            margin-bottom: 14px;
            color: #c9d1d9;
        }
        .doc ul, .doc ol {
            margin: 12px 0 16px 24px;
            color: #c9d1d9;
        }
        .doc li {
            margin-bottom: 8px;
        }
        .doc strong {
            color: #f0f6fc;
        }
        .doc code {
            background: #0d1117;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: ui-monospace, monospace;
            font-size: 13px;
            color: #79c0ff;
        }
        .doc a {
            color: #58a6ff;
            text-decoration: none;
        }
        .doc a:hover {
            text-decoration: underline;
        }
        .doc-back {
            display: inline-block;
            margin-bottom: 24px;
            color: #8b949e;
            text-decoration: none;
            font-size: 14px;
        }
        .doc-back:hover {
            color: #c9d1d9;
        }
        .updated {
            color: #6e7681;
            font-size: 13px;
            margin-top: 32px;
            padding-top: 16px;
            border-top: 1px solid #30363d;
        }
    </style>
</head>
<body>
    <div class="doc">
        <a href="javascript:history.back()" class="doc-back">← Назад</a>
        {{ content | safe }}
        <p class="updated">Последнее обновление: {{ updated }}</p>
    </div>
</body>
</html>
